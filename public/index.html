<!doctype html>
<html lang="%LANG_ISO_CODE%" dir="rtl" style="background-color: #0e1116">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <!-- A portfolio demo: it stays out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript
      >JavaScript is required to run this demo. · يلزم تفعيل JavaScript لتشغيل هذا العرض.</noscript
    >
    <!-- The root element for the app. -->
    <div id="root"></div>
  </body>
</html>
